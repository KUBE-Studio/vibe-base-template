name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

# Off until the repository variable DEPLOY_ENABLED is "true" (Settings → Secrets and
# variables → Actions → Variables): a fresh copy of the template has no server, and a
# deploy that fails on every push to main teaches nothing.
#
# Required repository secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY  – target server
#   DOMAIN                                    – public hostname (e.g. app.example.com)
#   AUTH_SECRET, POSTGRES_PASSWORD            – app secrets
#   BREVO_API_KEY, BREVO_SENDER_EMAIL
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ghcr.io/${{ github.repository }}
    APP_SLUG: ${{ github.event.repository.name }}

jobs:
    build-and-push:
        if: vars.DEPLOY_ENABLED == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v7

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        permissions:
            contents: read
            packages: read
        steps:
            - uses: actions/checkout@v7

            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

            - name: Copy compose + nginx config to server
              env:
                  DOMAIN: ${{ secrets.DOMAIN }}
              run: |
                  APP_DIR="/srv/${APP_SLUG}"
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p ${APP_DIR}"
                  scp -i ~/.ssh/deploy_key docker-compose.yml \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${APP_DIR}/docker-compose.yml

                  sed "s/__DOMAIN__/${DOMAIN}/g" nginx/app.conf > /tmp/${APP_SLUG}.conf
                  scp -i ~/.ssh/deploy_key /tmp/${APP_SLUG}.conf \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/etc/nginx/conf.d/${APP_SLUG}.conf

            - name: Write .env to server
              env:
                  APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  DOMAIN: ${{ secrets.DOMAIN }}
                  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
                  BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
              run: |
                  # URL-encode the password so special chars (/, \, ], @, …) don't
                  # break DATABASE_URL parsing. The raw password still goes to the
                  # postgres container via POSTGRES_PASSWORD.
                  ENCODED_PW=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["POSTGRES_PASSWORD"], safe=""))')
                  {
                    printf 'APP_IMAGE=%s\n' "$APP_IMAGE"
                    printf 'APP_SLUG=%s\n' "$APP_SLUG"
                    printf 'DOMAIN=%s\n' "$DOMAIN"
                    printf 'AUTH_SECRET=%s\n' "$AUTH_SECRET"
                    printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
                    printf 'BREVO_API_KEY=%s\n' "$BREVO_API_KEY"
                    printf 'BREVO_SENDER_EMAIL=%s\n' "$BREVO_SENDER_EMAIL"
                    printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
                    printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
                    printf 'DATABASE_URL=postgresql://app:%s@10.5.0.2:5432/app\n' "$ENCODED_PW"
                  } > /tmp/${APP_SLUG}.env
                  scp -i ~/.ssh/deploy_key /tmp/${APP_SLUG}.env \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/${APP_SLUG}/.env
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "chmod 600 /srv/${APP_SLUG}/.env"
                  rm -f /tmp/${APP_SLUG}.env

            - name: Deploy on server
              env:
                  DOMAIN: ${{ secrets.DOMAIN }}
              run: |
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                    "APP_SLUG='${APP_SLUG}' DOMAIN='${DOMAIN}' GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' bash -s" << 'ENDSSH'
                  set -e
                  cd "/srv/${APP_SLUG}"
                  echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                  docker compose pull
                  docker compose up -d --remove-orphans
                  docker image prune -f

                  if [ -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ]; then
                    rm -f /etc/nginx/conf.d/default.conf
                    nginx -t && systemctl reload nginx
                  else
                    echo "WARNING: SSL certs not found. Run the Setup Infrastructure workflow first."
                    exit 1
                  fi
                  ENDSSH
