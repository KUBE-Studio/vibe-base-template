name: Renew SSL Certificate

on:
    schedule:
        - cron: '0 3 1 * *' # 1st of every month at 03:00 UTC
    workflow_dispatch:

jobs:
    renew:
        # Same switch as deploy.yml: without a server there is no certificate to renew.
        if: vars.DEPLOY_ENABLED == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

            - name: Renew certificate and reload nginx
              run: |
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} bash -s << 'ENDSSH'
                  certbot renew --nginx --non-interactive
                  systemctl reload nginx
                  ENDSSH
