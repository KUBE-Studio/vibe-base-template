name: Setup Infrastructure

# One-time server provisioning: Docker, nginx, certbot + the first certificate.
# Point the DOMAIN's A record at DEPLOY_HOST BEFORE running this — certbot
# validates over HTTP and fails otherwise.
on:
    workflow_dispatch:

env:
    APP_SLUG: ${{ github.event.repository.name }}

jobs:
    provision:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

            - name: Verify DNS points at the server
              env:
                  DOMAIN: ${{ secrets.DOMAIN }}
              run: |
                  RESOLVED=$(dig +short "$DOMAIN" @8.8.8.8 A | head -1)
                  if [ "$RESOLVED" != "${{ secrets.DEPLOY_HOST }}" ]; then
                    echo "DNS for $DOMAIN resolves to '$RESOLVED', expected '${{ secrets.DEPLOY_HOST }}'."
                    echo "Create the A record first, then re-run this workflow."
                    exit 1
                  fi

            - name: Install Docker, nginx, certbot
              run: |
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                    "APP_SLUG='${APP_SLUG}' bash -s" << 'ENDSSH'
                  set -e
                  export DEBIAN_FRONTEND=noninteractive

                  if ! command -v docker &> /dev/null; then
                    curl -fsSL https://get.docker.com | sh
                    systemctl enable docker
                    systemctl start docker
                  fi

                  apt-get update
                  apt-get install -y nginx certbot python3-certbot-nginx
                  systemctl enable nginx
                  systemctl start nginx

                  # Clean up the distro default vhost so it can't shadow ours
                  rm -f /etc/nginx/conf.d/default.conf
                  rm -rf /etc/nginx/sites-available /etc/nginx/sites-enabled
                  sed -i '/sites-enabled/d' /etc/nginx/nginx.conf

                  mkdir -p "/srv/${APP_SLUG}"
                  ENDSSH

            - name: Push HTTP-only nginx config for the ACME challenge
              env:
                  DOMAIN: ${{ secrets.DOMAIN }}
              run: |
                  cat > /tmp/${APP_SLUG}-http.conf << NGINX
                  server {
                      listen 80;
                      server_name ${DOMAIN};

                      location / {
                          proxy_pass http://127.0.0.1:3000;
                          proxy_set_header Host \$host;
                          proxy_set_header X-Real-IP \$remote_addr;
                          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                          proxy_set_header X-Forwarded-Proto \$scheme;
                      }
                  }
                  NGINX

                  scp -i ~/.ssh/deploy_key /tmp/${APP_SLUG}-http.conf \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/etc/nginx/conf.d/${APP_SLUG}.conf
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "nginx -t && systemctl reload nginx"

            - name: Obtain SSL certificate
              env:
                  DOMAIN: ${{ secrets.DOMAIN }}
              run: |
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
                    "DOMAIN='${DOMAIN}' CERTBOT_EMAIL='${{ secrets.CERTBOT_EMAIL }}' bash -s" << 'ENDSSH'
                  set -e
                  certbot certonly --nginx -d "$DOMAIN" --non-interactive --agree-tos -m "$CERTBOT_EMAIL"
                  ls -la "/etc/letsencrypt/live/$DOMAIN/"
                  ENDSSH

            - name: Push full SSL nginx config
              env:
                  DOMAIN: ${{ secrets.DOMAIN }}
              run: |
                  sed "s/__DOMAIN__/${DOMAIN}/g" nginx/app.conf > /tmp/${APP_SLUG}.conf
                  scp -i ~/.ssh/deploy_key /tmp/${APP_SLUG}.conf \
                    ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/etc/nginx/conf.d/${APP_SLUG}.conf
                  ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "nginx -t && systemctl reload nginx"
